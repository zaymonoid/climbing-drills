<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Today's drills</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drills">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
<style>
  :root{--background:#fafaf9;--foreground:#1c1917;--card:#fff;--muted:#e7e5e4;--muted-foreground:#57534e;--subtle-foreground:#a8a29e;--border:#e7e5e4;--primary:#1c1917;--primary-foreground:#fafaf9;--secondary:#f5f5f4;--brand:#d97757;--radius:10px;--font-sans:system-ui,-apple-system,"Segoe UI",sans-serif}
  @media (prefers-color-scheme:dark){:root{--background:#1c1917;--foreground:#f5f5f4;--card:#262321;--muted:#3a3633;--muted-foreground:#a8a29e;--subtle-foreground:#78716c;--border:#3a3633;--primary:#f5f5f4;--primary-foreground:#1c1917;--secondary:#2e2a27}}
  body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.4 var(--font-sans)}
  .w{max-width:480px;margin:0 auto;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  .h{display:flex;justify-content:space-between;align-items:baseline}
  .h b{font-size:14px}
  .h span{color:var(--subtle-foreground);font-size:11px}
  .list{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
  .r{display:flex;gap:10px;padding:10px 12px;border-top:1px solid var(--border);min-height:22px;animation:enter .45s cubic-bezier(.34,1.56,.64,1) both}
  .r:first-child{border-top:0}
  .r.has{cursor:pointer}
  @keyframes enter{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
  .r.hidden .c{border-style:dashed;color:var(--subtle-foreground);font-size:10px}
  .bar{height:10px;margin-top:4px;border-radius:999px;background:var(--muted);animation:shim 1.6s ease-in-out infinite}
  @keyframes shim{50%{opacity:.5}}
  .r.rolling .t{color:var(--muted-foreground);filter:blur(.4px)}
  .r.rolling .c{border-style:dashed;animation:spin .8s linear infinite}
  .tick{animation:tick .09s ease-out}
  @keyframes tick{from{transform:translateY(-70%);opacity:.2}to{transform:none;opacity:1}}
  .r.land{animation:flash .7s ease-out both}
  .r.land .m,.r.land .c{animation:pop .45s cubic-bezier(.34,1.8,.64,1) both;transform-origin:left center}
  @keyframes pop{0%{transform:scale(.9)}50%{transform:scale(1.07)}100%{transform:scale(1)}}
  @keyframes flash{0%{background:color-mix(in srgb,var(--brand) 22%,transparent)}100%{background:transparent}}
  .c{width:18px;height:18px;flex:none;margin-top:1px;border:1.5px solid var(--border);border-radius:50%;display:grid;place-items:center;font-size:11px;color:transparent;cursor:pointer;transition:background .2s,border-color .2s,transform .2s cubic-bezier(.34,1.8,.64,1)}
  .r.done .c{background:var(--brand);border-color:var(--brand);color:#fff;transform:scale(1.15)}
  .r.done .t{text-decoration:line-through;color:var(--muted-foreground)}
  .m{min-width:0;flex:1;overflow:hidden}
  .t{font-size:13px;font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
  .g{font-size:10px;font-weight:500;color:var(--subtle-foreground);text-transform:uppercase;letter-spacing:.04em}
  .b{font-size:12px;line-height:1.4;color:var(--muted-foreground);margin-top:2px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;animation:fade .3s .15s both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .r.open .b{-webkit-line-clamp:unset}
  .x{font-size:11px;color:var(--subtle-foreground);align-self:center;transition:transform .2s}
  .r.open .x{transform:rotate(180deg)}
  button{font:inherit;font-size:13px;width:100%;padding:9px;border-radius:var(--radius);border:1px solid var(--border);background:var(--primary);color:var(--primary-foreground);cursor:pointer;display:flex;gap:6px;justify-content:center;align-items:center;transition:transform .15s,background .2s}
  button:active{transform:scale(.96)}
  button:disabled{background:var(--secondary);color:var(--muted-foreground);cursor:default;transform:none}
  .ic{display:inline-block}
  .spinning .ic{animation:spin .5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="w">
  <div class="h"><b>Today's drills</b><span id="d"></span></div>
  <div class="list" id="l"></div>
  <button id="go"></button>
</div>
<script>
const D=[
 {t:"Hover hands"},
 {t:"Toe screwing"},
 {t:"Pull on and do a single move",g:"Spray wall",b:"Heinous tension."},
 {t:"Single leg climbing"},
 {t:"Single arm climbing"},
 {t:"Both hands at the same time"},
 {t:"Lemay, drop lemay",b:"Drop lemay = lemay with heel."},
 {t:"Flag every move"},
 {t:"One touch limit moves",g:"Spray wall",b:"No readjusting."},
 {t:"Deadpoint accuracy ladder",b:"Same deadpoint to a small hold, extending further each round by moving to lower feet or a worse starting hold. Then work backwards and do it as statically as you can. The aim is control."},
 {t:"Progressive hold removal"},
 {t:"Low gear traverse",g:"Steep wall",b:"Stay at the bottom of a steep wall and traverse side to side, using every handhold with small moves. Falling off is fine."},
 {t:"Low gear full extension",g:"Spray wall",b:"Feet low, climb until your hands are nearly at full reach. Hold it and move hands 1–2 more times, then bring feet up and repeat. Slow, no cutting loose, rest 2–3 min."},
 {t:"Max velocity deadpoints",g:"Board",b:"On a 35–45° board, start matched on a jug and drive with your legs to near-max span. Stop as soon as speed drops."},
];
const l=document.getElementById('l'),btn=document.getElementById('go');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const now=new Date();
const day=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
function fnv(s){let h=0x811c9dc5;for(const ch of s){h^=ch.charCodeAt(0);h=Math.imul(h,0x01000193)}return h>>>0}
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todays(){const r=mulberry(fnv(day)),a=[...D];for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,4)}
document.getElementById('d').textContent=now.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const inner=d=>{const long=d.b&&d.b.length>45;
  return {long,html:`<div class="c">✓</div><div class="m"><div class="t">${d.t}${d.g?`<span class="g">${d.g}</span>`:''}</div>${d.b?`<div class="b">${d.b}</div>`:''}</div>${long?'<span class="x">▾</span>':''}`}};
function settle(row,d){const {long,html}=inner(d);row.className='r land'+(long?' has':'');row.innerHTML=html}
function untilMidnight(){const m=new Date();m.setHours(24,0,0,0);const s=Math.max(0,(m-new Date())/1000|0);return `${s/3600|0}h ${(s%3600)/60|0}m`}
let locked=false;
function lock(){locked=true;btn.disabled=true;btn.classList.remove('spinning');btn.textContent=`New drills in ${untilMidnight()}`}
function hidden(){
  l.innerHTML=[0,1,2,3].map(i=>`<div class="r hidden" style="animation-delay:${i*60}ms"><div class="c">?</div><div class="m"><div class="bar" style="width:${[62,48,70,40][i]}%"></div></div></div>`).join('');
  btn.innerHTML='<span class="ic">✦</span> Reveal today\'s drills';
}
function reveal(){
  btn.disabled=true;btn.classList.add('spinning');btn.innerHTML='<span class="ic">↻</span> Rolling…';
  const pick=todays();
  l.innerHTML=pick.map(()=>`<div class="r rolling" style="animation:none"><div class="c"></div><div class="m"><div class="t"></div></div></div>`).join('');
  const rows=[...l.children];let left=4;
  pick.forEach((d,i)=>{
    const row=rows[i],t=row.querySelector('.t'),dur=reduce?0:550+i*260,start=performance.now();let last;
    const tick=()=>{
      const el=performance.now()-start;
      if(el>=dur){settle(row,d);if(--left===0)lock();return}
      let n;do n=D[Math.random()*D.length|0].t;while(n===last);last=n;
      t.textContent=n;t.classList.remove('tick');void t.offsetWidth;t.classList.add('tick');
      setTimeout(tick,45+Math.pow(el/dur,2)*140);
    };tick();
  });
}
l.onclick=e=>{const r=e.target.closest('.r');if(!r||r.classList.contains('rolling')||r.classList.contains('hidden'))return;if(e.target.closest('.c'))r.classList.toggle('done');else if(r.classList.contains('has'))r.classList.toggle('open')};
btn.onclick=()=>{if(!btn.disabled)reveal()};
setInterval(()=>{if(locked)btn.textContent=`New drills in ${untilMidnight()}`},30000);
hidden();
</script>
</body>
</html>
